<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Temporarily Unavailable</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #e6e8eb;
      padding: 24px;
      line-height: 1.6;
    }
    .card { max-width: 520px; text-align: center; }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9aa3ad;
      border: 1px solid #2a2f37;
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    h1 { font-size: 28px; margin-bottom: 14px; font-weight: 600; }
    p { color: #aab2bb; font-size: 16px; }
    .meta { margin-top: 28px; font-size: 13px; color: #6b727b; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Maintenance</span>
    <h1>This site is temporarily unavailable</h1>
    <p>We&rsquo;re currently performing scheduled maintenance and expect to be back online shortly. Thank you for your patience.</p>
    <p class="meta">For inquiries, please contact the site administrator.</p>
  </main>
</body>
</html>
